services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: mindio_app
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mindio_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WORKNOTES_UPLOAD_PATH: /app/uploads
      WORKNOTES_UPLOAD_URL_PREFIX: ${SITE_URL}/api
      WORKNOTES_FRONTEND_BASE_URL: ${SITE_URL}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      AGENT_SERVICE_BASE_URL: http://agent:8100
    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: ./agents
    restart: unless-stopped
    environment:
      JAVA_INTERNAL_BASE_URL: http://server:8080/api
      INTERNAL_SHARED_TOKEN: ${AGENT_INTERNAL_TOKEN}
      DEFAULT_PROVIDER: ${AGENT_DEFAULT_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY}
      VOLCENGINE_ASR_APP_KEY: ${VOLCENGINE_ASR_APP_KEY}
      VOLCENGINE_ASR_ACCESS_KEY: ${VOLCENGINE_ASR_ACCESS_KEY}
    depends_on:
      - server

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - server

volumes:
  db_data:
  uploads_data:
