# =====================================================
# ProGuard Configuration for Spring Boot 3.x + JPA
# Run via: mvn clean package -Prelease
# =====================================================

# --- Core settings ---
# Keep all classes — Spring Boot uses reflection to load anything at runtime
-dontshrink
# Skip bytecode optimization — Spring relies on specific bytecode patterns
-dontoptimize

# Windows/macOS default filesystems are case-insensitive: without this,
# ProGuard can obfuscate two different classes to names that differ only
# by case (e.g. "c.A" and "c.a"), and writing both .class files silently
# clobbers one on disk -- the surviving class then has a dangling
# implements/extends reference to a .class that no longer exists, which
# crashes Spring's bean scanning at startup with a FileNotFoundException.
-dontusemixedcaseclassnames

# Keep annotation metadata at runtime (Spring / JPA / Jackson all read them)
-keepattributes *Annotation*
-keepattributes Signature, InnerClasses, EnclosingMethod, Exceptions

# Keep compiled parameter names (javac -parameters, on by default via the
# Spring Boot parent POM). Spring resolves @RequestParam/@PathVariable names
# from this attribute whenever the annotation doesn't specify one explicitly
# (e.g. "@RequestParam(defaultValue = "0") int page"); without it, every such
# endpoint 500s on first call with "parameter name information not found".
-keepattributes MethodParameters

# Strip source file names so stack traces show "SourceFile" instead of real path
-renamesourcefileattribute SourceFile
# Keep line numbers so you can still diagnose errors on your own builds
-keepattributes LineNumberTable

# --- Application Entry Point ---
-keep class com.entropybits.worknotes.spring_boot.Application {
    public static void main(java.lang.String[]);
}

# --- JPA Entities: keep everything ---
# JPQL queries reference Java field names directly ("WHERE n.owner = :owner"),
# and Hibernate uses reflection on field names alongside @Column annotations.
-keep @jakarta.persistence.Entity class * { *; }
-keep @jakarta.persistence.MappedSuperclass class * { *; }
-keep @jakarta.persistence.Embeddable class * { *; }

# --- Enums used as @Enumerated entity fields ---
# The -keep rules above only match the entity classes themselves, not enum
# types nested inside them (Note.GeneratedType, SourceClip.SourceType, ...).
# Hibernate reflectively calls values()/valueOf() to build CHECK constraints
# and to convert column values; without this, obfuscation breaks enum-ness
# and Hibernate NPEs while building the EntityManagerFactory.
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# --- Spring Configuration: keep class names ---
# Spring Boot auto-configuration and @ComponentScan use class names.
-keep @org.springframework.boot.autoconfigure.SpringBootApplication class * { *; }
-keep @org.springframework.context.annotation.Configuration class * { *; }
-keep @org.springframework.boot.context.properties.ConfigurationProperties class * { *; }

# Keep @Bean method names — they become the default bean name in the context.
-keepclassmembers @org.springframework.context.annotation.Configuration class * {
    @org.springframework.context.annotation.Bean <methods>;
}

# --- Spring Data Repositories: keep all ---
# Spring Data parses method names to derive JPQL queries (findByOwner...),
# and creates proxy implementations via reflection.
-keep interface * extends org.springframework.data.repository.Repository { *; }

# --- DTOs and API Models: keep all members ---
# Jackson serialization uses field names / getter names for JSON keys.
-keepclassmembers class com.entropybits.worknotes.spring_boot.dto.** { *; }
-keepclassmembers class com.entropybits.worknotes.spring_boot.ai.dto.** { *; }
-keepclassmembers class com.entropybits.worknotes.spring_boot.integration.**.dto.** { *; }
-keepclassmembers class com.entropybits.worknotes.spring_boot.integration.**.client.model.** { *; }

# DesktopLicenseStatus lives outside the dto packages above (it's under
# desktop/ alongside the controller/service). Without this, ProGuard renames
# its Lombok-generated getters, Jackson's ObjectMapper.canSerialize() then
# returns false for it (no recognizable bean properties), and every
# GET /v1/desktop/license/status request 500s with
# HttpMessageNotWritableException: "No converter for [class ...desktop.d]".
-keepclassmembers class com.entropybits.worknotes.spring_boot.desktop.DesktopLicenseStatus { *; }

# --- Spring Security ---
-keep class * implements org.springframework.security.core.userdetails.UserDetails { *; }
-keep class * implements org.springframework.security.core.userdetails.UserDetailsService { *; }
-keep class * implements org.springframework.security.core.GrantedAuthority { *; }

# --- Exceptions: keep class names ---
# Spring includes exception class names in HTTP error responses.
-keep class com.entropybits.worknotes.spring_boot.exception.** { *; }

# --- Suppress warnings for framework classes not present in classpath ---
-dontwarn org.springframework.**
-dontwarn jakarta.**
-dontwarn javax.**
-dontwarn sun.**
-dontwarn java.awt.**
-dontwarn org.slf4j.**
-dontwarn ch.qos.logback.**
-dontwarn com.mysql.**
-dontwarn io.jsonwebtoken.**
