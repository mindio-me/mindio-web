spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./desktop-data/worknotes;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/{vendor}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false

  docker:
    compose:
      enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.entropybits.worknotes: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl: ERROR

worknotes:
  upload:
    path: ${WORKNOTES_UPLOAD_PATH:./desktop-data/uploads}
    url-prefix: ${WORKNOTES_UPLOAD_URL_PREFIX:http://127.0.0.1:8080/api}
  frontend:
    base-url: ${WORKNOTES_FRONTEND_BASE_URL:http://127.0.0.1:18022}
  desktop:
    license:
      pinned-public-keys:
        - kid: mindio-prod-key
          algorithm: Ed25519
          public-key-x509-base64: MCowBQYDK2VwAyEAlJWRMXCW78gODhNmb7hpYG0FcxjtwTzbhQPs8KqM//c=
