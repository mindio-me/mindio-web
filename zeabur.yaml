apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: MindIO
spec:
  description: "MindIO is a personal workspace for turning input into output. Self-hostable notes, local resources, AI analysis, and publishing."
  icon: "https://raw.githubusercontent.com/mindio-me/mindio-web/main/static/favicon.png"
  tags:
    - productivity
    - notes
    - ai
  variables:
    - key: DB_PASSWORD
      type: STRING
      name: Database Password
      description: "Password for the MySQL database (choose a strong password)"
    - key: DB_ROOT_PASSWORD
      type: STRING
      name: Database Root Password
      description: "Root password for MySQL"
    - key: JWT_SECRET
      type: STRING
      name: JWT Secret
      description: "A long random string for signing JWT tokens (at least 32 characters)"
    - key: AGENT_INTERNAL_TOKEN
      type: STRING
      name: Agent Internal Token
      description: "A long random string shared between server and agent for internal API auth"
    - key: ANTHROPIC_API_KEY
      type: STRING
      name: Anthropic API Key
      description: "API key for the AI chat feature (leave blank to disable)"
  services:
    - name: db
      icon: "https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/mysql.svg"
      template: PREBUILT
      spec:
        source:
          image: mysql:5.7
        ports:
          - id: database
            port: 3306
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/mysql
        env:
          MYSQL_DATABASE:
            default: mindio_app
            expose: true
          MYSQL_USER:
            default: mindio
            expose: true
          MYSQL_PASSWORD:
            default: ${DB_PASSWORD}
            expose: true
          MYSQL_ROOT_PASSWORD:
            default: ${DB_ROOT_PASSWORD}
          MYSQL_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          MYSQL_PORT:
            default: "3306"
            expose: true
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    # NOTE: server/web/agent now build from source out of this single repo's
    # server/, frontend/, agents/ subdirectories (see the root Dockerfiles in
    # each) instead of downloading a prebuilt release jar. `rootDirectory` is
    # Zeabur's documented way to point a GIT-sourced service at a monorepo
    # subdirectory, but this hasn't been deployed/tested against a live
    # Zeabur project since the repo restructuring - verify before relying on
    # it for a real one-click deploy.
    - name: server
      template: GIT
      spec:
        source:
          source: GITHUB
          repo: 1247446367
          branch: main
          rootDirectory: server
        ports:
          - id: web
            port: 8080
            type: HTTP
        volumes:
          - id: uploads
            dir: /app/uploads
        env:
          SPRING_DATASOURCE_URL:
            default: "jdbc:mysql://db:3306/mindio_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
          DB_USERNAME:
            default: mindio
          DB_PASSWORD:
            default: ${DB_PASSWORD}
          JWT_SECRET:
            default: ${JWT_SECRET}
          WORKNOTES_UPLOAD_PATH:
            default: /app/uploads
          WORKNOTES_UPLOAD_URL_PREFIX:
            default: ${ZEABUR_WEB_DOMAIN}/api
          WORKNOTES_FRONTEND_BASE_URL:
            default: ${ZEABUR_WEB_DOMAIN}
          AGENT_INTERNAL_TOKEN:
            default: ${AGENT_INTERNAL_TOKEN}
          AGENT_SERVICE_BASE_URL:
            default: "http://agent:8100"
        dependencies:
          - db

    - name: agent
      template: GIT
      spec:
        source:
          source: GITHUB
          repo: 1247446367
          branch: main
          rootDirectory: agents
        ports:
          - id: agent
            port: 8100
            type: HTTP
        env:
          JAVA_INTERNAL_BASE_URL:
            default: "http://server:8080/api"
          INTERNAL_SHARED_TOKEN:
            default: ${AGENT_INTERNAL_TOKEN}
          DEFAULT_PROVIDER:
            default: anthropic
          ANTHROPIC_API_KEY:
            default: ${ANTHROPIC_API_KEY}
        dependencies:
          - server

    - name: web
      template: GIT
      spec:
        source:
          source: GITHUB
          repo: 1247446367
          branch: main
          rootDirectory: frontend
        ports:
          - id: web
            port: 80
            type: HTTP
        dependencies:
          - server
