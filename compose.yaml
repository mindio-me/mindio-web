services:
  mysql:
    image: mysql:8.0
    container_name: worknotes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: worknotes
      MYSQL_USER: worknotes
      MYSQL_PASSWORD: worknotes123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
